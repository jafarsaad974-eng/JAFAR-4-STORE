<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الوكلاء - بالجملة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-6">

  <div class="max-w-5xl mx-auto">
    <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-md">
      <div>
        <h1 class="text-2xl font-bold text-blue-600">لوحة عرض المنتجات للوكلاء</h1>
        <p class="text-sm text-gray-500">الأسعار المعروضة شاملة نسبة العمولات الخاصة بك</p>
      </div>
      <span class="text-sm bg-green-100 text-green-800 font-semibold px-3 py-1 rounded-full">حساب وكيل معتمد</span>
    </header>

    <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <p class="text-gray-500 col-span-3 text-center py-10">جاري تحميل المنتجات والأسعار...</p>
    </div>
  </div>

  <script>
    // ⚠️ انسخ مفاتيحك من ملف النص واستبدل القيم بين التنصيص هنا:
    const SUPABASE_URL = 'https://pgwigtxrghfyegnvqztq.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'sb_publishable_Tq3RQhcxWCBcWpTFTtN3dA_CyKJ2krD';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadProducts() {
      const grid = document.getElementById('products-grid');
      
      const { data: products, error } = await supabaseClient.from('products').select('*');

      if (error || !products || products.length === 0) {
        grid.innerHTML = `
          <div class="col-span-3 text-center py-12 bg-white rounded-xl shadow p-6">
            <p class="text-gray-600 text-lg">لا توجد منتجات معروضة حالياً.</p>
            <p class="text-sm text-gray-400 mt-2">تأكد من وضع رابط المشروع ومفتاح anon بشكل صحيح أو إضافة منتجات في قاعدة البيانات.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = products.map(item => `
        <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition flex flex-col justify-between">
          <div>
            <img src="${item.image_url || 'https://via.placeholder.com/300'}" class="w-full h-48 object-cover">
            <div class="p-4">
              <span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded font-semibold">${item.category || 'عام'}</span>
              <h3 class="text-lg font-bold mt-2 text-gray-900">${item.title}</h3>
              <p class="text-gray-500 text-sm mt-1 line-clamp-2">${item.description || ''}</p>
            </div>
          </div>
          <div class="p-4 pt-0 border-t mt-4 flex justify-between items-center">
            <span class="text-xs text-gray-400">سعر الوكيل:</span>
            <span class="text-xl font-bold text-green-600">${item.cost_price} $</span>
          </div>
        </div>
      `).join('');
    }

    loadProducts();
  </script>
</body>
</html>
